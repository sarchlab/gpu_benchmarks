name: Compile Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile-cuda:
    name: Compile (CUDA)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04
    env:
      # The shared runner has no GPU, so nvcc's `-arch=native` cannot detect a
      # card and falls back to a default arch below sm_53, where FP16 intrinsics
      # like __hfma2 are undefined. Pin to sm_90 (H100) — the arch `native`
      # resolves to on the self-hosted GPU runner — so the compile check matches
      # the real target. Every benchmark Makefile honors CUDA_ARCH (?= native).
      CUDA_ARCH: sm_90
    steps:
      - name: Install dependencies
        run: |
          install_ok=0
          for i in 1 2 3; do
            if apt-get update && apt-get install -y git wget make gcc g++ python3; then
              install_ok=1
              break
            fi
            if [ "$i" -lt 3 ]; then
              echo "Retry $i/3 failed, waiting 30s..."
              sleep 30
            fi
          done

          if [ "$install_ok" -ne 1 ]; then
            echo "Dependency installation failed after 3 attempts."
            exit 1
          fi

      - name: Verify wget is available
        run: command -v wget >/dev/null 2>&1

      - name: Install Go
        run: |
          ARCH=$(dpkg --print-architecture)
          wget -q "https://go.dev/dl/go1.23.4.linux-${ARCH}.tar.gz"
          tar -C /usr/local -xzf "go1.23.4.linux-${ARCH}.tar.gz"
          rm "go1.23.4.linux-${ARCH}.tar.gz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build gpubench
        run: go build -buildvcs=false -o gpubench ./cmd/gpubench

      - name: Test gpubench
        run: go test ./cmd/gpubench

      - name: Test trace codecs
        run: go test ./tracer/...

      - name: Check k-means input admission (no GPU required)
        run: |
          make -C tier2/rodinia_kmeans PLATFORM=cuda
          python3 tests/kmeans_input_parameters.py --compiler g++ --binary tier2/rodinia_kmeans/rodinia_kmeans

      - name: Check atomic attempts, count bounds and measured-result hooks
        run: |
          python3 tests/atomic_host.py --compiler g++
          python3 tests/atomic_measured_result.py --platform cuda --work-dir /tmp/atomic-measured --compile-only

      - name: Check Particle Filter inputs, complete references and measured-result hooks
        run: |
          python3 tests/particlefilter_host.py --compiler g++
          python3 tests/particlefilter_profile_records.py
          python3 tests/particlefilter_measured_result.py --platform cuda --work-dir /tmp/particlefilter-measured --compile-only

      - name: Reject stale H100 qualification profiles
        run: python3 tests/h100_profile_identity_test.py

      - name: Check SHOC SpMV reference and compile measured-output regression
        run: |
          python3 tests/shoc_spmv_verification.py --host-only --compiler g++ --work-dir /tmp/shoc-spmv-host
          python3 tests/shoc_spmv_verification.py --platform cuda --compile-only --work-dir /tmp/shoc-spmv-measured

      - name: Check complete FIR reference and compile measured-output regression
        run: |
          python3 tests/fir_verification.py --host-only --compiler g++ --work-dir /tmp/fir-host
          python3 tests/fir_verification.py --platform cuda --compile-only --work-dir /tmp/fir-measured

      - name: Check SHOC GEMM full reference and compile measured-output regression
        run: |
          python3 tests/shoc_gemm_verification.py --host-only --compiler g++ --work-dir /tmp/shoc-gemm-host
          python3 tests/shoc_gemm_verification.py --platform cuda --compile-only --work-dir /tmp/shoc-gemm-measured

      - name: Check separable convolution reference and compile complete-output regression
        run: |
          python3 tests/convolution_verification.py --host-only --compiler g++ --work-dir /tmp/convolution-host
          python3 tests/convolution_verification.py --platform cuda --compile-only --work-dir /tmp/convolution-measured

      - name: Check complete CUTCP reference and compile measured-output regression
        run: |
          python3 tests/cutcp_verification.py --host-only --compiler g++ --work-dir /tmp/cutcp-host
          python3 tests/cutcp_verification.py --platform cuda --compile-only --work-dir /tmp/cutcp-measured

      - name: Compile CUTCP ownership and complete-small-output regression
        run: python3 tests/cutcp_concurrency.py --platform cuda --work-dir /tmp/cutcp-concurrency --compile-only

      - name: Check AES known answers and compile measured-output regression
        run: |
          python3 tests/aes_verification.py --host-only --compiler g++ --work-dir /tmp/aes-host
          python3 tests/aes_verification.py --platform cuda --compile-only --work-dir /tmp/aes-measured

      - name: Check complete PageRank reference and compile measured-output regression
        run: |
          python3 tests/graph_pr_verification.py --host-only --compiler g++ --work-dir /tmp/graph-pr-host
          python3 tests/graph_pr_verification.py --platform cuda --compile-only --work-dir /tmp/graph-pr-measured

      - name: Check complete CC labels and compile measured-output regression
        run: |
          python3 tests/graph_cc_verification.py --host-only --compiler g++ --work-dir /tmp/graph-cc-host
          python3 tests/graph_cc_verification.py --platform cuda --compile-only --work-dir /tmp/graph-cc-measured

      - name: Check pinned CFD solver, mesh geometry and measured-result hooks
        run: |
          python3 tests/cfd_host.py --compiler g++
          python3 tests/cfd_measured_result.py --platform cuda --work-dir /tmp/cfd-measured --compile-only
          make -C tier2/altis_cfd PLATFORM=cuda bench_output_test

      - name: Check pinned HotSpot physics, complete references and measured-result hooks
        run: |
          python3 tests/hotspot_host.py --compiler g++
          python3 tests/hotspot_measured_result.py --platform cuda --work-dir /tmp/hotspot-measured --compile-only
          make -C tier2/rodinia_hotspot PLATFORM=cuda bench_output_test

      - name: Check pinned HotSpot3D physics, full references and measured-result hooks
        run: |
          python3 tests/hotspot3d_host.py --compiler g++
          python3 tests/hotspot3d_measured_result.py --platform cuda --work-dir /tmp/hotspot3d-measured --compile-only
          make -C tier2/rodinia_hotspot3d PLATFORM=cuda bench_output_test

      - name: Check pinned NAS CG inputs, reference, worker cleanup and measured-result hooks
        run: |
          python3 tests/cg_host.py --compiler g++
          python3 tests/cg_measured_result.py --platform cuda --work-dir /tmp/cg-measured --compile-only

      - name: Check pinned NAS MG inputs, full hierarchy, worker cleanup and measured-result hooks
        run: |
          python3 tests/mg_host.py --compiler g++
          python3 tests/mg_measured_result.py --platform cuda --work-dir /tmp/mg-measured --compile-only

      - name: Check pinned Jacobi inputs, complete CPU grids and measured-result hooks
        run: |
          python3 tests/jacobi_host.py --compiler g++
          python3 tests/jacobi_measured_result.py --platform cuda --work-dir /tmp/jacobi-measured --compile-only
          make -C tier2/polybench_jacobi2d PLATFORM=cuda bench_output_test

      - name: Check GUPS stream, complete table verification and controls
        run: |
          python3 tests/gups_reference.py --compiler g++
          python3 tests/gups_measured_result.py --platform cuda --work-dir /tmp/gups-measured --compile-only

      - name: Check N-body CPU comparison and compile measured-state regression
        run: |
          python3 tests/nbody_reference.py --compiler g++
          python3 tests/nbody_profile_records.py
          python3 tests/nbody_measured_result.py --platform cuda --work-dir /tmp/nbody-measured --compile-only

      - name: Check complete k-means CPU reference (no GPU required)
        run: |
          g++ -O3 -std=c++14 -pthread -fsanitize=address,undefined -fno-sanitize-recover=all tests/kmeans_reference_test.cpp -o /tmp/kmeans_reference_test
          /tmp/kmeans_reference_test

      - name: Compile measured k-means verification regression
        run: python3 tests/kmeans_measured_result.py --platform cuda --work-dir /tmp/kmeans-measured-result --compile-only

      - name: Check complete matrix-vector CPU references (no GPU required)
        run: |
          g++ -O2 -std=c++14 -fsanitize=address,undefined -fno-sanitize-recover=all tests/matvec_reference_test.cpp -o /tmp/matvec_reference_test
          /tmp/matvec_reference_test

      - name: Compile measured matrix-vector verification regression
        run: python3 tests/matvec_measured_result.py --platform cuda --work-dir /tmp/matvec-measured-result --compile-only

      - name: Check complete SRAD CPU reference (no GPU required)
        run: |
          g++ -O3 -std=c++14 -pthread -fsanitize=address,undefined -fno-sanitize-recover=all tests/srad_reference_test.cpp -o /tmp/srad_reference_test
          /tmp/srad_reference_test

      - name: Compile measured SRAD verification regression
        run: python3 tests/srad_measured_result.py --platform cuda --work-dir /tmp/srad-measured-result --compile-only

      - name: Reject nonpositive SRAD parameters (no GPU required)
        run: python3 tests/srad_invalid_parameters.py --binary /tmp/srad-measured-result/tier2/rodinia_srad/rodinia_srad

      - name: Check SRAD index-range admission (no GPU required)
        run: python3 tests/srad_index_range.py --compiler g++ --binary /tmp/srad-measured-result/tier2/rodinia_srad/rodinia_srad

      - name: Check complete FDTD CPU reference (no GPU required)
        run: |
          g++ -O3 -std=c++14 -pthread -fsanitize=address,undefined -fno-sanitize-recover=all tests/fdtd_reference_test.cpp -o /tmp/fdtd_reference_test
          /tmp/fdtd_reference_test

      - name: Compile measured FDTD verification regression
        run: python3 tests/fdtd_measured_result.py --platform cuda --work-dir /tmp/fdtd-measured-result --compile-only

      - name: Check complete 3MM CPU references (no GPU required)
        run: |
          g++ -O3 -std=c++14 -pthread -fsanitize=address,undefined -fno-sanitize-recover=all tests/mm3_reference_test.cpp -o /tmp/mm3_reference_test
          /tmp/mm3_reference_test

      - name: Compile measured 3MM verification regression
        run: python3 tests/mm3_measured_result.py --platform cuda --work-dir /tmp/mm3-measured-result --compile-only

      - name: Check complete GEMM CPU reference (no GPU required)
        run: |
          g++ -O3 -std=c++14 -pthread -fsanitize=address,undefined -fno-sanitize-recover=all tests/gemm_reference_test.cpp -o /tmp/gemm_reference_test
          /tmp/gemm_reference_test

      - name: Compile measured GEMM verification regression
        run: python3 tests/gemm_measured_result.py --platform cuda --work-dir /tmp/gemm-measured-result --compile-only

      - name: Check complete correlation CPU reference (no GPU required)
        run: |
          g++ -O3 -std=c++14 -fsanitize=address,undefined -fno-sanitize-recover=all tests/correlation_reference_test.cpp -o /tmp/correlation_reference_test
          /tmp/correlation_reference_test

      - name: Compile measured correlation verification regression
        run: python3 tests/correlation_measured_result.py --platform cuda --work-dir /tmp/correlation-measured-result --compile-only

      - name: Check complete LavaMD CPU reference (no GPU required)
        run: |
          g++ -O3 -std=c++14 -fsanitize=address,undefined -fno-sanitize-recover=all tests/lavamd_reference_test.cpp -o /tmp/lavamd_reference_test
          /tmp/lavamd_reference_test

      - name: Compile measured Black-Scholes verification regression
        run: python3 tests/blackscholes_measured_result.py --platform cuda --work-dir /tmp/blackscholes-measured-result --compile-only

      - name: Compile measured LavaMD verification regression
        run: python3 tests/lavamd_measured_result.py --platform cuda --work-dir /tmp/lavamd-measured-result --compile-only

      - name: Check complete SYR2K CPU reference (no GPU required)
        run: |
          g++ -O3 -std=c++14 -fsanitize=address,undefined -fno-sanitize-recover=all tests/syr2k_reference_test.cpp -o /tmp/syr2k_reference_test
          /tmp/syr2k_reference_test

      - name: Compile measured SYR2K verification regression
        run: python3 tests/syr2k_measured_result.py --platform cuda --work-dir /tmp/syr2k-measured-result --compile-only

      - name: Check complete 2MM CPU reference (no GPU required)
        run: |
          g++ -O3 -std=c++14 -fsanitize=address,undefined -fno-sanitize-recover=all tests/two_mm_reference_test.cpp -o /tmp/two_mm_reference_test
          /tmp/two_mm_reference_test

      - name: Compile measured 2MM verification regression
        run: python3 tests/two_mm_measured_result.py --platform cuda --work-dir /tmp/two-mm-measured-result --compile-only

      - name: Check complete SHOC Stencil2D CPU reference (no GPU required)
        run: |
          g++ -O3 -std=c++14 -fsanitize=address,undefined -fno-sanitize-recover=all tests/shoc_stencil_reference_test.cpp -o /tmp/shoc_stencil_reference_test
          /tmp/shoc_stencil_reference_test

      - name: Compile measured SHOC Stencil2D verification regression
        run: python3 tests/shoc_stencil_measured_result.py --platform cuda --work-dir /tmp/shoc-stencil-measured-result --compile-only

      - name: Check full stencil CPU reference (no GPU required)
        run: |
          g++ -O2 -std=c++14 -fsanitize=address,undefined -fno-sanitize-recover=all tests/stencil_reference_test.cpp -o /tmp/stencil_reference_test
          /tmp/stencil_reference_test

      - name: Compile measured stencil verification regression
        run: python3 tests/stencil_measured_result.py --platform cuda --work-dir /tmp/stencil-measured-result --compile-only

      - name: Check full BFS CPU distances (no GPU required)
        run: |
          g++ -O2 -std=c++14 -fsanitize=address,undefined -fno-sanitize-recover=all tests/bfs_reference_test.cpp -o /tmp/bfs_reference_test
          /tmp/bfs_reference_test

      - name: Compile measured BFS verification regression
        run: python3 tests/bfs_measured_result.py --platform cuda --work-dir /tmp/bfs-measured-result --compile-only

      - name: Check BFS input ranges (no GPU required)
        run: python3 tests/bfs_input_ranges.py --compiler g++

      - name: Check NPB EP input ranges (no GPU required)
        run: python3 tests/npb_ep_input_ranges.py --compiler g++

      - name: Check binomial CPU reference (no GPU required)
        run: |
          g++ -std=c++14 -O3 -pthread -fsanitize=address,undefined -fno-sanitize-recover=all tests/binomial_cpu_reference.cpp -o /tmp/binomial-cpu-reference
          /tmp/binomial-cpu-reference

      - name: Check Pathfinder input ranges (no GPU required)
        run: python3 tests/pathfinder_input_ranges.py --compiler g++

      - name: Check concurrent BFS kernels (no GPU required)
        run: python3 tests/bfs_concurrent_kernels.py --compiler g++

      - name: Check cache-latency input ranges (no GPU required)
        run: python3 tests/cache_latency_input_ranges.py --compiler g++

      - name: Check BFS instrumentation anchors (no GPU required)
        run: python3 tests/bfs_work_counts_test.py

      - name: Compile BFS operation-count regression
        run: python3 tests/bfs_work_counts.py --platform cuda --work-dir /tmp/bfs-work-counts --compile-only

      - name: Check full LU residual arithmetic (no GPU required)
        run: |
          g++ -O3 -std=c++14 -fsanitize=address,undefined -fno-sanitize-recover=all tests/lud_residual_test.cpp -o /tmp/lud_residual_test
          /tmp/lud_residual_test

      - name: Compile measured LUD verification regression
        run: python3 tests/lud_measured_result.py --platform cuda --work-dir /tmp/lud-measured-result --compile-only

      - name: Check graph input and full triangle-reference equivalence
        run: |
          g++ -O3 -std=c++14 -fsanitize=address,undefined -fno-sanitize-recover=all tests/triangle_host_test.cpp -o /tmp/triangle_host_test
          /tmp/triangle_host_test

      - name: Compile exact triangle-total verification regression
        run: python3 tests/triangle_total_verification.py --platform cuda --work-dir /tmp/triangle-total-verification --compile-only

      - name: Check pinned NW reference and input ranges (no GPU required)
        run: python3 tests/nw_reference.py --compiler g++

      - name: Compile measured NW verification regression
        run: python3 tests/nw_measured_result.py --platform cuda --work-dir /tmp/nw-measured --compile-only

      - name: Check cache-bandwidth geometry and compile GPU topology test
        run: |
          python3 tests/cache_bandwidth_geometry.py --compiler g++
          python3 tests/cache_bandwidth_gpu.py --compile-only --work-dir /tmp/cache-bandwidth-gpu

      - name: Check SpMV execution-control records (no GPU required)
        run: python3 tests/parboil_spmv_controls.py --compiler g++

      - name: Validate benchmark manifests
        run: ./gpubench validate

      - name: Regression check (cuDNN fallback diagnostics)
        run: |
          conv_out=$(make -C tier3/cudnn_conv PLATFORM=cuda CUDNN_PATH=/tmp/does-not-exist-cudnn clean all 2>&1)
          bn_out=$(make -C tier3/cudnn_batchnorm PLATFORM=cuda CUDNN_PATH=/tmp/does-not-exist-cudnn clean all 2>&1)

          echo "$conv_out"
          echo "$bn_out"

          echo "$conv_out" | grep -q "WARNING: cudnn_conv cuDNN not found; building diagnostic fallback executable."
          echo "$bn_out" | grep -q "WARNING: cudnn_batchnorm cuDNN not found; building diagnostic fallback executable."
          echo "$conv_out" | grep -q "searched include paths:"
          echo "$conv_out" | grep -q "searched library paths:"
          echo "$bn_out" | grep -q "searched include paths:"
          echo "$bn_out" | grep -q "searched library paths:"
          test -x tier3/cudnn_conv/cudnn_conv
          test -x tier3/cudnn_batchnorm/cudnn_batchnorm

      - name: Check Tier 1/2 shared-header rebuild dependencies
        run: python3 tests/common_header_dependencies.py

      - name: Compile Tier 1 (CUDA)
        run: ./gpubench compile --tier 1 --platform cuda

      - name: Compile FMA output regression tests (GPU required to run)
        run: |
          make -C tier1/fp32_throughput PLATFORM=cuda bench_output_test
          make -C tier1/fp64_throughput PLATFORM=cuda bench_output_test

      - name: Check shared-memory ownership and compile GPU output test
        run: |
          make -C tier1/shared_mem_bandwidth test-pattern
          make -C tier1/shared_mem_bandwidth PLATFORM=cuda bench_output_test

      - name: Compile native shuffle output test (GPU required to run)
        run: make -C tier1/warp_shuffle PLATFORM=cuda bench_output_test

      - name: Compile Tier 2 (CUDA)
        run: ./gpubench compile --tier 2 --platform cuda

      - name: Compile 2MM production-pass reference test (GPU required to run)
        run: make -C tier2/polybench_2mm PLATFORM=cuda bench_output_test

      - name: Compile algorithmic reset output tests (GPU required to run)
        run: |
          make -C tier2/polybench_gramschmidt PLATFORM=cuda bench_output_test
          make -C tier2/npb_mg PLATFORM=cuda bench_output_test

      - name: Compile backprop production-epoch reference test (GPU required to run)
        run: make -C tier2/rodinia_backprop PLATFORM=cuda bench_output_test

      - name: Compile 2D convolution operator test (GPU required to run)
        run: make -C tier2/polybench_2dconv PLATFORM=cuda bench_output_test

      - name: Compile Chai CEDD operator reference test (GPU required to run)
        run: make -C tier2/chai_cedd PLATFORM=cuda bench_output_test

      - name: Compile 3D convolution operator test (GPU required to run)
        run: make -C tier2/polybench_3dconv PLATFORM=cuda bench_output_test

      - name: Compile Parboil stencil production-pass test (GPU required to run)
        run: make -C tier2/parboil_stencil PLATFORM=cuda bench_output_test

      - name: Compile binomial measured-result tests (GPU required to run)
        run: python3 tests/binomial_measured_result.py --platform cuda --work-dir /tmp/binomial-measured --compile-only

      - name: Compile finite-verification fault-injection tests (GPU required to run)
        run: python3 tests/finite_verification.py --platform cuda --work-dir /tmp/finite-verification --compile-only

      - name: Check verification-control records (no GPU required)
        run: python3 tests/verification_control_records.py --compiler g++

      - name: Compile Tier 3 (CUDA)
        run: ./gpubench compile --tier 3 --platform cuda

      - name: Compile Tier 4 (CUDA)
        run: ./gpubench compile --tier 4 --platform cuda
