name: Compile Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile-cuda:
    name: Compile (CUDA)
    runs-on: self-hosted
    container: nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04
    steps:
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            apt-get update && apt-get install -y git wget make gcc g++ && break
            echo "Retry $i/3 failed, waiting 30s..."
            sleep 30
          done

      - name: Install Go
        run: |
          ARCH=$(dpkg --print-architecture)
          wget -q "https://go.dev/dl/go1.23.4.linux-${ARCH}.tar.gz"
          tar -C /usr/local -xzf "go1.23.4.linux-${ARCH}.tar.gz"
          rm "go1.23.4.linux-${ARCH}.tar.gz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build gpubench
        run: go build -buildvcs=false -o gpubench ./cmd/gpubench

      - name: Regression check (cuDNN diagnostics)
        run: |
          set +e
          conv_out=$(make -C tier3/cudnn_conv PLATFORM=cuda CUDNN_PATH=/tmp/does-not-exist-cudnn check-deps 2>&1)
          conv_status=$?
          bn_out=$(make -C tier3/cudnn_batchnorm PLATFORM=cuda CUDNN_PATH=/tmp/does-not-exist-cudnn check-deps 2>&1)
          bn_status=$?
          set -e

          echo "$conv_out"
          echo "$bn_out"

          test "$conv_status" -ne 0
          test "$bn_status" -ne 0
          echo "$conv_out" | grep -q "requires cuDNN, but cudnn.h was not found"
          echo "$bn_out" | grep -q "requires cuDNN, but cudnn.h was not found"

      - name: Compile Tier 1 (CUDA)
        run: ./gpubench compile --tier 1 --platform cuda

      - name: Compile Tier 2 (CUDA)
        run: ./gpubench compile --tier 2 --platform cuda

      - name: Compile Tier 3 (CUDA)
        run: ./gpubench compile --tier 3 --platform cuda

      - name: Compile Tier 4 (CUDA)
        run: ./gpubench compile --tier 4 --platform cuda
