name: Compile Benchmarks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-cuda:
    name: Compile (CUDA)
    runs-on: self-hosted
    container: nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git wget make gcc g++

      - name: Install Go
        run: |
          ARCH=$(dpkg --print-architecture)
          wget -q "https://go.dev/dl/go1.23.4.linux-${ARCH}.tar.gz"
          tar -C /usr/local -xzf "go1.23.4.linux-${ARCH}.tar.gz"
          rm "go1.23.4.linux-${ARCH}.tar.gz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build gpubench
        run: go build -buildvcs=false -o gpubench ./cmd/gpubench

      - name: Compile Tier 1 (CUDA)
        run: ./gpubench compile --tier 1 --platform cuda

      - name: Compile Tier 2 (CUDA)
        run: ./gpubench compile --tier 2 --platform cuda

      - name: Compile Tier 3 (CUDA)
        run: ./gpubench compile --tier 3 --platform cuda

      - name: Compile Tier 4 (CUDA)
        run: ./gpubench compile --tier 4 --platform cuda

