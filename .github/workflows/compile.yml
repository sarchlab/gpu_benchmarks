name: Compile Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile-cuda:
    name: Compile (CUDA)
    runs-on: self-hosted
    container: nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04
    steps:
      - name: Install dependencies
        run: |
          install_ok=0
          for i in 1 2 3; do
            if apt-get update && apt-get install -y git wget make gcc g++; then
              install_ok=1
              break
            fi
            if [ "$i" -lt 3 ]; then
              echo "Retry $i/3 failed, waiting 30s..."
              sleep 30
            fi
          done

          if [ "$install_ok" -ne 1 ]; then
            echo "Dependency installation failed after 3 attempts."
            exit 1
          fi

      - name: Verify wget is available
        run: command -v wget >/dev/null 2>&1

      - name: Install Go
        run: |
          ARCH=$(dpkg --print-architecture)
          wget -q "https://go.dev/dl/go1.23.4.linux-${ARCH}.tar.gz"
          tar -C /usr/local -xzf "go1.23.4.linux-${ARCH}.tar.gz"
          rm "go1.23.4.linux-${ARCH}.tar.gz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build gpubench
        run: go build -buildvcs=false -o gpubench ./cmd/gpubench

      - name: Regression check (cuDNN fallback diagnostics)
        run: |
          conv_out=$(make -C tier3/cudnn_conv PLATFORM=cuda CUDNN_PATH=/tmp/does-not-exist-cudnn clean all 2>&1)
          bn_out=$(make -C tier3/cudnn_batchnorm PLATFORM=cuda CUDNN_PATH=/tmp/does-not-exist-cudnn clean all 2>&1)

          echo "$conv_out"
          echo "$bn_out"

          echo "$conv_out" | grep -q "WARNING: cudnn_conv cuDNN not found; building diagnostic fallback executable."
          echo "$bn_out" | grep -q "WARNING: cudnn_batchnorm cuDNN not found; building diagnostic fallback executable."
          echo "$conv_out" | grep -q "searched include paths:"
          echo "$conv_out" | grep -q "searched library paths:"
          echo "$bn_out" | grep -q "searched include paths:"
          echo "$bn_out" | grep -q "searched library paths:"
          test -x tier3/cudnn_conv/cudnn_conv
          test -x tier3/cudnn_batchnorm/cudnn_batchnorm

      - name: Compile Tier 1 (CUDA)
        run: ./gpubench compile --tier 1 --platform cuda

      - name: Compile Tier 2 (CUDA)
        run: ./gpubench compile --tier 2 --platform cuda

      - name: Compile Tier 3 (CUDA)
        run: ./gpubench compile --tier 3 --platform cuda

      - name: Compile Tier 4 (CUDA)
        run: ./gpubench compile --tier 4 --platform cuda
